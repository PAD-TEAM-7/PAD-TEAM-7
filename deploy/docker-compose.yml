# PAD TEAM 7 — team deployment.
# Every service runs from its published DockerHub image: no Dockerfiles, no builds.
# Each service owns a private PostgreSQL database, persisted in its own named volume.
#
#   cp .env.example .env    # fill in the secrets — .env is never committed
#   docker compose up -d
#
# Lab 2: the API gateway (port 8080) is the only entry point. Services are not published to the
# host, except Game on 8002, whose WebSocket the gateway hands to clients directly. To reach the
# services directly while debugging:
#   docker compose -f docker-compose.yml -f docker-compose.direct-ports.yml up -d
name: pad-team-7

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-auth: &auth
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is not set in .env}
  PLAYER_JWKS_URL: ${PLAYER_JWKS_URL:-}
  PLAYER_JWT_ISSUER: player-service
  MOCK_PLAYER_JWT_SECRET: ${MOCK_PLAYER_JWT_SECRET:?MOCK_PLAYER_JWT_SECRET is not set in .env}
  AUTH_DEV_TOKENS: ${AUTH_DEV_TOKENS:-true}
  # Lab 2: the gateway verifies tokens and sends a signed identity instead (X-Auth-* headers).
  # A service in gateway mode trusts only that identity and never sees a token.
  GATEWAY_IDENTITY_SECRET: ${GATEWAY_IDENTITY_SECRET:?GATEWAY_IDENTITY_SECRET is not set in .env}

# Lab 2: every service reaches every other service through the API gateway, addressed by its
# service prefix (http://gateway:8080/<service>/api/v1/...). Override one in .env only to debug.
x-via-gateway: &via-gateway
  PLAYER_SERVICE_URL: ${PLAYER_SERVICE_URL:-http://gateway:8080/player-service}
  GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://gateway:8080/game-service}
  EXAM_SERVICE_URL: ${EXAM_SERVICE_URL:-http://gateway:8080/exam-service}
  WORLD_SERVICE_URL: ${WORLD_SERVICE_URL:-http://gateway:8080/world-service}
  ZOMBIE_SERVICE_URL: ${ZOMBIE_SERVICE_URL:-http://gateway:8080/zombie-service}
  RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL:-http://gateway:8080/resource-service}
  BASE_SERVICE_URL: ${BASE_SERVICE_URL:-http://gateway:8080/base-service}
  CRAFTING_SERVICE_URL: ${CRAFTING_SERVICE_URL:-http://gateway:8080/crafting-service}

services:
  # ----------------------------------------------------------------- API Gateway (Ilico Artemie)
  # The single point of entry: every REST request — from the client and between services — goes
  # through it. Written in Python. Its image has a built-in health check.
  gateway:
    image: artflow/gateway:${GATEWAY_VERSION:-2.1.0}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      # Authentication: every token is verified here and never forwarded (grade 10).
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET is not set in .env}
      GATEWAY_IDENTITY_SECRET: ${GATEWAY_IDENTITY_SECRET:?GATEWAY_IDENTITY_SECRET is not set in .env}
      PLAYER_JWKS_URL: http://player-service:8001/api/v1/auth/jwks
      PLAYER_JWT_ISSUER: player-service
      # Services that still verify tokens themselves keep receiving the token until they trust the
      # gateway identity. Grade 10 is complete when this list is empty.
      LEGACY_AUTH_SERVICES: ${GATEWAY_LEGACY_AUTH_SERVICES:-}
      DEV_TOKENS: ${GATEWAY_DEV_TOKENS:-false}
      GAME_WS_PUBLIC_URL: ${GAME_WS_PUBLIC_URL:-ws://localhost:8002}
      # Limits (grade 8).
      UPSTREAM_CONNECT_TIMEOUT_SECONDS: ${GATEWAY_CONNECT_TIMEOUT_SECONDS:-2}
      UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-10}
      UPSTREAM_MAX_CONNECTIONS: ${GATEWAY_UPSTREAM_MAX_CONNECTIONS:-200}
      MAX_REQUEST_BODY_BYTES: ${GATEWAY_MAX_REQUEST_BODY_BYTES:-1048576}
      TASK_TIMEOUT_SECONDS: ${GATEWAY_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      MAX_CONCURRENT_PER_SERVICE: ${GATEWAY_MAX_CONCURRENT_PER_SERVICE:-50}
      DEBUG_ENDPOINTS: ${GATEWAY_DEBUG_ENDPOINTS:-false}
      # The gateway is the one component that addresses the services directly.
      PLAYER_SERVICE_URL: http://player-service:8001
      GAME_SERVICE_URL: http://game-service:8002
      EXAM_SERVICE_URL: http://exam-service:8003
      WORLD_SERVICE_URL: http://world-service:8004
      ZOMBIE_SERVICE_URL: http://zombie-service:8005
      RESOURCE_SERVICE_URL: http://resource-service:8006
      BASE_SERVICE_URL: http://base-service:8007
      CRAFTING_SERVICE_URL: http://crafting-service:8008
    depends_on:
      player-service:
        condition: service_started
      game-service:
        condition: service_started
      exam-service:
        condition: service_started
      world-service:
        condition: service_started
      zombie-service:
        condition: service_started
      resource-service:
        condition: service_started
      base-service:
        condition: service_started
      crafting-service:
        condition: service_started

  # --------------------------------------------------------------- Player Service (Islam Abu Koush)
  player-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${PLAYER_DB_USER:-player}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?PLAYER_DB_PASSWORD is not set in .env}
      POSTGRES_DB: player_db
    volumes:
      - player_db_data:/var/lib/postgresql/data
      - ./db/player_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  player-service:
    image: geografix/player-service:${PLAYER_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *via-gateway
      PORT: 8001
      DATABASE_URL: postgres://${PLAYER_DB_USER:-player}:${PLAYER_DB_PASSWORD}@player-db:5432/player_db?sslmode=disable
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      AUTH_DEV_TOKENS: ${AUTH_DEV_TOKENS:-true}
      TASK_TIMEOUT_SECONDS: ${PLAYER_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${PLAYER_MAX_CONCURRENT_REQUESTS:-100}
    depends_on:
      player-db:
        condition: service_healthy

  # ----------------------------------------------------------------- Game Service (Islam Abu Koush)
  game-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${GAME_DB_USER:-game}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?GAME_DB_PASSWORD is not set in .env}
      POSTGRES_DB: game_db
    volumes:
      - game_db_data:/var/lib/postgresql/data
      - ./db/game_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  game-service:
    image: geografix/game-service:${GAME_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: [*auth, *via-gateway]
      PORT: 8002
      DATABASE_URL: postgres://${GAME_DB_USER:-game}:${GAME_DB_PASSWORD}@game-db:5432/game_db?sslmode=disable
      PLAYER_JWKS_URL: http://gateway:8080/api/v1/auth/jwks
      ACTION_TIME_SCALE: ${ACTION_TIME_SCALE:-0.01}
      TASK_TIMEOUT_SECONDS: ${GAME_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${GAME_MAX_CONCURRENT_REQUESTS:-100}
    depends_on:
      game-db:
        condition: service_healthy
      player-service:
        condition: service_started

  # ---------------------------------------------------------------- Exam Service (Ilico Artemie)
  exam-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${EXAM_DB_USER:-exam}
      POSTGRES_PASSWORD: ${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is not set in .env}
      POSTGRES_DB: exam_db
    volumes:
      - exam_db_data:/var/lib/postgresql/data

  exam-service:
    image: artflow/exam-service:${EXAM_SERVICE_VERSION:-2.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      AUTH_MODE: gateway
      PORT: 8003
      DB_HOST: exam-db
      DB_PORT: 5432
      DB_USER: ${EXAM_DB_USER:-exam}
      DB_PASSWORD: ${EXAM_DB_PASSWORD}
      DB_NAME: exam_db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8003/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    depends_on:
      exam-db:
        condition: service_healthy

  # ---------------------------------------------------------------- World Service (Ilico Artemie)
  world-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${WORLD_DB_USER:-world}
      POSTGRES_PASSWORD: ${WORLD_DB_PASSWORD:?WORLD_DB_PASSWORD is not set in .env}
      POSTGRES_DB: world_db
    volumes:
      - world_db_data:/var/lib/postgresql/data

  world-service:
    image: artflow/world-service:${WORLD_SERVICE_VERSION:-2.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      AUTH_MODE: gateway
      PORT: 8004
      DB_HOST: world-db
      DB_PORT: 5432
      DB_USER: ${WORLD_DB_USER:-world}
      DB_PASSWORD: ${WORLD_DB_PASSWORD}
      DB_NAME: world_db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8004/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    depends_on:
      world-db:
        condition: service_healthy

  # ---------------------------------------------------------------- Base Service (Gancear Nichita)
  base-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${BASE_DB_USER:-base}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:?BASE_DB_PASSWORD is not set in .env}
      POSTGRES_DB: base_db
    volumes:
      - base_db_data:/var/lib/postgresql/data
      - ./db/base_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  base-service:
    image: nnick34567890/base-service:${BASE_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      PORT: 8007
      DB_HOST: base-db
      DB_PORT: 5432
      DB_USER: ${BASE_DB_USER:-base}
      DB_PASSWORD: ${BASE_DB_PASSWORD}
      DB_NAME: base_db
    depends_on:
      base-db:
        condition: service_healthy

  # ------------------------------------------------------------ Crafting Service (Gancear Nichita)
  crafting-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${CRAFTING_DB_USER:-crafting}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:?CRAFTING_DB_PASSWORD is not set in .env}
      POSTGRES_DB: crafting_db
    volumes:
      - crafting_db_data:/var/lib/postgresql/data
      - ./db/crafting_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  crafting-service:
    image: nnick34567890/crafting-service:${CRAFTING_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      PORT: 8008
      DB_HOST: crafting-db
      DB_PORT: 5432
      DB_USER: ${CRAFTING_DB_USER:-crafting}
      DB_PASSWORD: ${CRAFTING_DB_PASSWORD}
      DB_NAME: crafting_db
    depends_on:
      crafting-db:
        condition: service_healthy

  # --------------------------------------------------------------- Zombie Service (Roenco Maxim)
  zombie-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${ZOMBIE_DB_USER:-zombie}
      POSTGRES_PASSWORD: ${ZOMBIE_DB_PASSWORD:?ZOMBIE_DB_PASSWORD is not set in .env}
      POSTGRES_DB: zombie_db
    volumes:
      - zombie_db_data:/var/lib/postgresql/data

  zombie-service:
    image: geografix/zombie-service:${ZOMBIE_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      PORT: 8005
      DATABASE_URL: postgres://${ZOMBIE_DB_USER:-zombie}:${ZOMBIE_DB_PASSWORD}@zombie-db:5432/zombie_db?sslmode=disable
      PLAYER_JWKS_URL: http://gateway:8080/api/v1/auth/jwks
    depends_on:
      zombie-db:
        condition: service_healthy
      player-service:
        condition: service_started
      resource-service:
        condition: service_started

  # ------------------------------------------------------------- Resource Service (Roenco Maxim)
  resource-db:
    <<: *postgres
    environment:
      POSTGRES_USER: ${RESOURCE_DB_USER:-resource}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:?RESOURCE_DB_PASSWORD is not set in .env}
      POSTGRES_DB: resource_db
    volumes:
      - resource_db_data:/var/lib/postgresql/data

  resource-service:
    image: geografix/resource-service:${RESOURCE_SERVICE_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: [*auth, *via-gateway]
      PORT: 8006
      DATABASE_URL: postgres://${RESOURCE_DB_USER:-resource}:${RESOURCE_DB_PASSWORD}@resource-db:5432/resource_db?sslmode=disable
    depends_on:
      resource-db:
        condition: service_healthy

volumes:
  player_db_data:
  game_db_data:
  exam_db_data:
  world_db_data:
  base_db_data:
  crafting_db_data:
  zombie_db_data:
  resource_db_data:
