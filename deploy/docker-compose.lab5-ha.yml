{
  "services": {
    "db-router": {
      "build": "./db-ha",
      "restart": "unless-stopped",
      "environment": {
        "PLAYER_DB_PASSWORD": "${PLAYER_DB_PASSWORD}",
        "GAME_DB_PASSWORD": "${GAME_DB_PASSWORD}",
        "EXAM_DB_PASSWORD": "${EXAM_DB_PASSWORD}",
        "WORLD_DB_PASSWORD": "${WORLD_DB_PASSWORD}",
        "ZOMBIE_DB_PASSWORD": "${ZOMBIE_DB_PASSWORD}",
        "RESOURCE_DB_PASSWORD": "${RESOURCE_DB_PASSWORD}",
        "BASE_DB_PASSWORD": "${BASE_DB_PASSWORD}",
        "CRAFTING_DB_PASSWORD": "${CRAFTING_DB_PASSWORD}"
      },
      "depends_on": {
        "player-db": {
          "condition": "service_started"
        },
        "game-db": {
          "condition": "service_started"
        },
        "exam-db": {
          "condition": "service_started"
        },
        "world-db": {
          "condition": "service_started"
        },
        "zombie-db": {
          "condition": "service_started"
        },
        "resource-db": {
          "condition": "service_started"
        },
        "base-db": {
          "condition": "service_started"
        },
        "crafting-db": {
          "condition": "service_started"
        }
      }
    },
    "warehouse-etl": {
      "environment": {
        "ETL_DB_ROUTER": "db-router",
        "ETL_PLAYER_PORT": "15432",
        "ETL_GAME_PORT": "15433",
        "ETL_EXAM_PORT": "15434",
        "ETL_WORLD_PORT": "15435",
        "ETL_ZOMBIE_PORT": "15436",
        "ETL_RESOURCE_PORT": "15437",
        "ETL_BASE_PORT": "15438",
        "ETL_CRAFTING_PORT": "15439"
      },
      "depends_on": {
        "db-router": {
          "condition": "service_started"
        }
      }
    },
    "player-db": {
      "entrypoint": [
        "/bin/sh",
        "/db-ha/start.sh"
      ],
      "volumes": [
        "./db-ha:/db-ha:ro"
      ]
    },
    "player-db-replica-1": {
      "entrypoint": [
        "/bin/sh",
        "/db-ha/start.sh"
      ],
      "volumes": [
        "./db-ha:/db-ha:ro",
        "player_db_replica_1_data:/var/lib/postgresql/data"
      ],
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "depends_on": {
        "db-router": {
          "condition": "service_started"
        }
      },
      "environment": {
        "POSTGRES_USER": "player",
        "POSTGRES_DB": "player_db",
        "POSTGRES_PASSWORD": "${PLAYER_DB_PASSWORD}",
        "FOLLOW_HOST": "db-router",
        "FOLLOW_PORT": "15432",
        "PGDATA": "/var/lib/postgresql/data/replica"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "pg_isready",
          "-U",
          "player",
          "-d",
          "player_db"
        ],
        "interval": "3s",
        "timeout": "2s",
        "retries": 30
      }
    },
    "player-db-replica-2": {
      "entrypoint": [
        "/bin/sh",
        "/db-ha/start.sh"
      ],
