# Lab 3: Islam's Player/Game, Maxim's Zombie/Resource, and shared infrastructure.
# Published images only. Add docker-compose.lab3.build.yml for local development.
name: pad-lab3

x-discovery: &discovery
  DISCOVERY_URL: http://service-discovery:8500
  DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?Set DISCOVERY_TOKEN in .env (32+ characters)}

x-auth: &auth
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?Set SERVICE_JWT_SECRET}
  GATEWAY_IDENTITY_SECRET: ${GATEWAY_IDENTITY_SECRET:?Set GATEWAY_IDENTITY_SECRET}

x-game: &game
  image: geografix/game-service:${LAB3_GAME_VERSION:-3.0.0}
  restart: unless-stopped
  depends_on:
    game-db: {condition: service_healthy}
    service-discovery: {condition: service_started}
  environment: &game-env
    <<: [*auth, *discovery]
    PORT: 8002
    DATABASE_URL: postgres://game:${GAME_DB_PASSWORD}@game-db:5432/game_db?sslmode=disable
    PLAYER_JWKS_URL: http://gateway:8080/api/v1/auth/jwks
    PLAYER_SERVICE_URL: http://gateway:8080/player-service
    WORLD_SERVICE_URL: ${LAB3_WORLD_SERVICE_URL:-}
    BASE_SERVICE_URL: ${LAB3_BASE_SERVICE_URL:-}
    RESOURCE_SERVICE_URL: ${LAB3_RESOURCE_SERVICE_URL:-}
    EXAM_SERVICE_URL: ${LAB3_EXAM_SERVICE_URL:-}
    ZOMBIE_SERVICE_URL: ${LAB3_ZOMBIE_SERVICE_URL:-}
    ACTION_TIME_SCALE: ${ACTION_TIME_SCALE:-0.01}
    TASK_TIMEOUT_SECONDS: ${GAME_TASK_TIMEOUT_SECONDS:-15}
    MAX_CONCURRENT_REQUESTS: ${GAME_MAX_CONCURRENT_REQUESTS:-100}
    AUTH_DEV_TOKENS: "false"

services:
  service-discovery:
    image: geografix/service-discovery:${LAB3_DISCOVERY_VERSION:-3.0.0}
    restart: unless-stopped
    ports: ["127.0.0.1:${LAB3_DISCOVERY_PORT:-18500}:8500"]
    environment:
      <<: *discovery
      DATABASE_PATH: /app/data/registry.sqlite
      PROBE_INTERVAL: ${DISCOVERY_PROBE_INTERVAL:-5}
      CRITICAL_LOAD: ${DISCOVERY_CRITICAL_LOAD:-0.8}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes: [discovery_data:/app/data]

  gateway:
    image: geografix/pad-gateway:${LAB3_GATEWAY_VERSION:-3.0.0}
    restart: unless-stopped
    ports: ["${LAB3_GATEWAY_PORT:-18080}:8080"]
    environment:
      <<: [*auth, *discovery]
      DISCOVERY_SERVICES: player-service,game-service,zombie-service,resource-service,base-service,crafting-service,exam-service,world-service
      PLAYER_JWKS_URL: http://player-service:8001/api/v1/auth/jwks
      PLAYER_SERVICE_URL: http://player-service:8001
      GAME_SERVICE_URL: http://game-service:8002
      ZOMBIE_SERVICE_URL: http://zombie-service:8005
      RESOURCE_SERVICE_URL: http://resource-service:8006
      GAME_WS_PUBLIC_URL: ws://localhost:${LAB3_GAME_PORT:-18002}
      DEV_TOKENS: ${GATEWAY_DEV_TOKENS:-false}
      UPSTREAM_TIMEOUT_SECONDS: 10
    depends_on:
      service-discovery: {condition: service_started}
      player-service: {condition: service_started}

  player-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?Set PLAYER_DB_PASSWORD}
      POSTGRES_DB: player_db
    volumes: [player_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U player -d player_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  game-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?Set GAME_DB_PASSWORD}
      POSTGRES_DB: game_db
    volumes: [game_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U game -d game_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  player-service:
    image: geografix/player-service:${LAB3_PLAYER_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      PORT: 8001
      DATABASE_URL: postgres://player:${PLAYER_DB_PASSWORD}@player-db:5432/player_db?sslmode=disable
      PLAYER_SIGNING_KEY_FILE: /var/lib/player-service/signing-key.pem
      TASK_TIMEOUT_SECONDS: ${PLAYER_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${PLAYER_MAX_CONCURRENT_REQUESTS:-100}
      AUTH_DEV_TOKENS: "false"
    volumes: [player_signing_key_data:/var/lib/player-service]
    depends_on:
      player-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  zombie-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zombie
      POSTGRES_PASSWORD: ${ZOMBIE_DB_PASSWORD:?Set ZOMBIE_DB_PASSWORD}
      POSTGRES_DB: zombie_db
    volumes: [zombie_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zombie -d zombie_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resource
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:?Set RESOURCE_DB_PASSWORD}
      POSTGRES_DB: resource_db
    volumes: [resource_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U resource -d resource_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  zombie-service:
    image: geografix/zombie-service:${LAB3_ZOMBIE_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      PORT: 8005
      DATABASE_URL: postgres://zombie:${ZOMBIE_DB_PASSWORD}@zombie-db:5432/zombie_db?sslmode=disable
      PLAYER_JWKS_URL: http://gateway:8080/api/v1/auth/jwks
      PLAYER_SERVICE_URL: http://gateway:8080/player-service
      RESOURCE_SERVICE_URL: http://gateway:8080/resource-service
      TASK_TIMEOUT_SECONDS: ${ZOMBIE_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${ZOMBIE_MAX_CONCURRENT_REQUESTS:-100}
      AUTH_DEV_TOKENS: "false"
    depends_on:
      zombie-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  resource-service:
    image: geografix/resource-service:${LAB3_RESOURCE_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      PORT: 8006
      DATABASE_URL: postgres://resource:${RESOURCE_DB_PASSWORD}@resource-db:5432/resource_db?sslmode=disable
      PLAYER_JWKS_URL: http://gateway:8080/api/v1/auth/jwks
      TASK_TIMEOUT_SECONDS: ${RESOURCE_TASK_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_REQUESTS: ${RESOURCE_MAX_CONCURRENT_REQUESTS:-100}
      AUTH_DEV_TOKENS: "false"
    depends_on:
      resource-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  game-service:
    <<: *game
    ports: ["${LAB3_GAME_PORT:-18002}:8002"]
    environment:
      <<: *game-env
      INSTANCE_ID: game-1
      INSTANCE_URL: http://game-service:8002
      INSTANCE_WS_URL: ${LAB3_GAME_WS_URL:-ws://localhost:18002}

  game-service-2:
    <<: *game
    ports: ["${LAB3_GAME2_PORT:-18012}:8002"]
    environment:
      <<: *game-env
      INSTANCE_ID: game-2
      INSTANCE_URL: http://game-service-2:8002
      INSTANCE_WS_URL: ${LAB3_GAME2_WS_URL:-ws://localhost:18012}

  # ------------------------------------------------- Base and Crafting (Gancear Nichita)
  # Both register in Service Discovery, renew their lease every 5 s, report /api/v1/status with a
  # numeric load, and report every failed call so Discovery removes the failing instance.
  base-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: base
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:?Set BASE_DB_PASSWORD}
      POSTGRES_DB: base_db
    volumes: [base_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U base -d base_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  crafting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crafting
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:?Set CRAFTING_DB_PASSWORD}
      POSTGRES_DB: crafting_db
    volumes: [crafting_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crafting -d crafting_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  base-service:
    image: nnick34567890/base-service:${LAB3_BASE_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      AUTH_MODE: gateway
      PORT: 8007
      DB_HOST: base-db
      DB_USER: base
      DB_PASSWORD: ${BASE_DB_PASSWORD}
      DB_NAME: base_db
      # Required by the service's config; unused in gateway mode, where tokens never reach it.
      MOCK_PLAYER_JWT_SECRET: ${MOCK_PLAYER_JWT_SECRET:-unused-in-gateway-mode}
      AUTH_DEV_TOKENS: "false"
      TASK_TIMEOUT_MS: 10000
      RESOURCE_SERVICE_URL: http://gateway:8080/resource-service
      PLAYER_SERVICE_URL: http://gateway:8080/player-service
      WORLD_SERVICE_URL: ${LAB3_BASE_WORLD_URL:-http://gateway:8080/world-service}
      EXAM_SERVICE_URL: ${LAB3_BASE_EXAM_URL:-http://gateway:8080/exam-service}
    depends_on:
      base-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  crafting-service:
    image: nnick34567890/crafting-service:${LAB3_CRAFTING_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      AUTH_MODE: gateway
      PORT: 8008
      DB_HOST: crafting-db
      DB_USER: crafting
      DB_PASSWORD: ${CRAFTING_DB_PASSWORD}
      DB_NAME: crafting_db
      MOCK_PLAYER_JWT_SECRET: ${MOCK_PLAYER_JWT_SECRET:-unused-in-gateway-mode}
      AUTH_DEV_TOKENS: "false"
      TASK_TIMEOUT_MS: 10000
      RESOURCE_SERVICE_URL: http://gateway:8080/resource-service
      PLAYER_SERVICE_URL: http://gateway:8080/player-service
      BASE_SERVICE_URL: http://gateway:8080/base-service
      WORLD_SERVICE_URL: ${LAB3_CRAFTING_WORLD_URL:-http://gateway:8080/world-service}
      EXAM_SERVICE_URL: ${LAB3_CRAFTING_EXAM_URL:-http://gateway:8080/exam-service}
    depends_on:
      crafting-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  # ------------------------------------------------------- Exam and World (Ilico Artemie)
  # Both register in Service Discovery, renew their lease every 5 s, report /api/v1/status with a
  # numeric load, and report every failed call so Discovery removes the failing instance.
  exam-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${EXAM_DB_PASSWORD:?Set EXAM_DB_PASSWORD}
      POSTGRES_DB: exam_db
    volumes: [exam_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U exam -d exam_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  world-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: world
      POSTGRES_PASSWORD: ${WORLD_DB_PASSWORD:?Set WORLD_DB_PASSWORD}
      POSTGRES_DB: world_db
    volumes: [world_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U world -d world_db"]
      interval: 3s
      timeout: 2s
      retries: 20

  exam-service:
    image: artflow/exam-service:${LAB3_EXAM_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      AUTH_MODE: gateway
      PORT: 8003
      DB_HOST: exam-db
      DB_PORT: 5432
      DB_USER: exam
      DB_PASSWORD: ${EXAM_DB_PASSWORD}
      DB_NAME: exam_db
      TASK_TIMEOUT_MS: 10000
      PLAYER_SERVICE_URL: http://gateway:8080/player-service
      WORLD_SERVICE_URL: http://gateway:8080/world-service
      CRAFTING_SERVICE_URL: http://gateway:8080/crafting-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8003/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    depends_on:
      exam-db: {condition: service_healthy}
      service-discovery: {condition: service_started}

  world-service:
    image: artflow/world-service:${LAB3_WORLD_VERSION:-3.0.0}
    restart: unless-stopped
    deploy: {replicas: 2}
    environment:
      <<: [*auth, *discovery]
      AUTH_MODE: gateway
      PORT: 8004
      DB_HOST: world-db
      DB_PORT: 5432
      DB_USER: world
      DB_PASSWORD: ${WORLD_DB_PASSWORD}
      DB_NAME: world_db
      TASK_TIMEOUT_MS: 10000
      RESOURCE_SERVICE_URL: http://gateway:8080/resource-service
      CRAFTING_SERVICE_URL: http://gateway:8080/crafting-service
      GAME_SERVICE_URL: http://gateway:8080/game-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8004/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    depends_on:
      world-db: {condition: service_healthy}
      service-discovery: {condition: service_started}
volumes:
  discovery_data:
  player_db_data:
  game_db_data:
  player_signing_key_data:
  zombie_db_data:
  resource_db_data:
  base_db_data:
  crafting_db_data:
  exam_db_data:
  world_db_data:
